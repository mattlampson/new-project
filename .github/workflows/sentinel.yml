name: AI Release Notes Sentinel

on:
  # DISABLED: Cron and push triggers disabled to stop spam emails.
  # The Jina Reader proxy fails intermittently against Cloudflare,
  # causing hash oscillation and ~8-9 false-positive emails/day.
  # See: https://github.com/mattlampson/new-project/issues
  #
  # push:
  #   branches:
  #     - main
  #     - "claude/*"
  # schedule:
  #   - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sentinel
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update state" && git push)
 
